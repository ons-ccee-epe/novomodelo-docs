# Starlight CI — pull-request verification for the Astro/Starlight docs.
#
# On every pull request to `main` (and on manual dispatch) this workflow installs
# Node, a pinned d2 and a pinned novomodelo, runs the static corpus gates before the
# build, builds the multi-version site with `npm run build:versions`, then runs
# `npm test`, `npm run check`, `npm run check:math`, `npm run check:links` and
# `npm run check:e10`.
#
# It deploys nothing: no Pages artifact, no CNAME, no pages: or id-token:
# permissions. starlight-deploy.yml publishes on push to `main` and runs a subset
# of these steps (ADR-019); the doc-lint gates and every gate added after them run
# only here.
#
# Lint locally with `actionlint .github/workflows/starlight-ci.yml`.

name: Starlight CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same ref (e.g. a force-push to an open PR).
concurrency:
  group: starlight-ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: this is a verification-only workflow (no deploy, no Pages).
# Lock the job token to read-only so it cannot publish even if the repo's default
# Actions permission is "read and write" (mirrors starlight-staging.yml).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Steps run at the repository root, where the Astro project lives; setup-node's
    # cache-dependency-path is the root `package-lock.json`.
    defaults:
      run:
        working-directory: .

    steps:
      # fetch-depth: 0 — Lunaria (the /lunaria dashboard) reads each content file's
      # git history; a shallow clone makes the Starlight build fail with "could not
      # retrieve last commit data". Full history is required.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: package-lock.json

      # astro-d2 shells out to a `d2` executable that must be on PATH at build
      # time, or D2 fenced blocks silently render nothing. Install a PINNED
      # release asset (reproducible) — NOT `curl … d2lang.com/install.sh | sh`
      # (the banned, unpinned curl|bash pattern).
      # sha256 pinned: d2 v0.7.1 ships no checksums file, so this hash was
      # computed from the released linux-amd64 asset. A tampered or replaced
      # tarball fails `sha256sum -c` and aborts the step before extraction.
      - name: Install d2 (pinned 0.7.1, sha256-verified)
        run: |
          d2_tarball=d2-v0.7.1-linux-amd64.tar.gz
          d2_sha256=eb172adf59f38d1e5a70ab177591356754ffaf9bebb84e0ca8b767dfb421dad7
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/v0.7.1/${d2_tarball}" -o "${d2_tarball}"
          echo "${d2_sha256}  ${d2_tarball}" | sha256sum -c -
          tar xzf "${d2_tarball}"
          sudo mv d2-v0.7.1/bin/d2 /usr/local/bin/d2
          sudo chmod +x /usr/local/bin/d2

      # Print the pinned version so a silent install failure surfaces here,
      # before the build, instead of as confusing "missing figures" output.
      - name: Verify d2
        run: d2 --version

      # ticket-243 (GRD-05, G3 decision B1, ADR-021): check:gc-examples runs the
      # pinned non-MPI novomodelo release asset, installed the way d2 is: pinned URL,
      # workflow-pinned sha256, extract, move onto PATH. The workflow pins the
      # sha256 itself; the release `.sha256` sidecar is not the pin source. Bump the
      # URL, the hash, this step's name, the README check:gc-examples line and
      # scripts/novomodelo-ref.mjs DEFAULT_NOVOMODELO_REF together at each novomodelo sync: the
      # gate exits 2 when `novomodelo version` differs from that ref. Re-vendor the
      # error kinds in the same sync with `npm run refresh:error-kinds`
      # (check:error-coverage reads them).
      # Only the binary is extracted, so the directory is empty after the move and
      # nothing is left in the checkout for the build.
      - name: Install novomodelo (pinned v0.18.0, sha256-verified)
        run: |
          novomodelo_tarball=novomodelo-cli-x86_64-unknown-linux-gnu.tar.xz
          novomodelo_sha256=636d692eb6bcc5388dea62decb351962d76275f5f5b0b07b35fa7e43f171dc38
          curl -fsSL "https://github.com/ons-ccee-epe/novomodelo/releases/download/v0.18.0/${novomodelo_tarball}" -o "${novomodelo_tarball}"
          echo "${novomodelo_sha256}  ${novomodelo_tarball}" | sha256sum -c -
          tar xJf "${novomodelo_tarball}" novomodelo-cli-x86_64-unknown-linux-gnu/novomodelo
          sudo mv novomodelo-cli-x86_64-unknown-linux-gnu/novomodelo /usr/local/bin/novomodelo
          sudo chmod +x /usr/local/bin/novomodelo
          rm -f "${novomodelo_tarball}"
          rmdir novomodelo-cli-x86_64-unknown-linux-gnu

      - name: Verify novomodelo
        run: novomodelo version

      - name: Install dependencies
        run: npm ci

      # E10 ticket-031: regenerate the third-party notices file and fail if
      # the committed copy is stale (drift guard). Uses permissions: contents: read
      # — no push, no auto-commit. Maintainer must run `npm run gen:notices` and
      # commit the result when deps change.
      - name: Notices drift guard
        run: |
          npm run gen:notices
          git diff --exit-code -- public/THIRD-PARTY-NOTICES.txt

      - name: Check figures (dependency guard)
        run: npm run check:figures

      # Epic 04 ticket-015: the two-voice methodology gates, ported from
      # novomodelo's scripts/ci/check_doc_voice.py / check_doc_counts.py /
      # check_book_version.py. Static source-reading checks (no build needed),
      # so they run pre-build alongside check:figures. Pre-existing strict-zone
      # hits are grandfathered in scripts/doc-lint-allow.txt; check:voice and
      # check:version fail only on a NEW, un-allowlisted violation.
      - name: Check doc voice (two-voice hype/unpinned-number gate)
        run: npm run check:voice

      - name: Check doc counts (column/field count vs adjacent table)
        run: npm run check:counts

      - name: Check doc version (novomodelo-version references vs the Synced-to anchor)
        run: npm run check:version

      # R62/ADR-007: change-narration ratchet, both zones (static source read, pre-build).
      # Pre-existing hits are grandfathered per owning epic in scripts/doc-lint-allow.txt.
      - name: Check doc narration (change-narration ratchet, both zones)
        run: npm run check:narration

      # E13 ticket-218 (GRD-07): static source read, pre-build; ratchet: scripts/doc-lint-allow.txt.
      - name: Check glossary (no software tokens; index complete)
        run: npm run check:glossary

      # E13 ticket-214 (GRD-08): every emitted ErrorKind/LoadError variant has an error-codes section; vendored copy, no novomodelo checkout (ADR-020).
      - name: Check error coverage (error-codes vs vendored error kinds)
        run: npm run check:error-coverage

      # E13 ticket-215 (GRD-03): vendored input schemas vs the case-format tables, both directions (R87); static, pre-build.
      - name: Check input schemas (vendored schemas vs case-format tables)
        run: npm run check:input-schemas

      # GRD-04 (R87): every public novomodelo-python stub symbol has an anchor in reference/python-api; reads the vendored scripts/pystubs/ (refresh:pystubs), no novomodelo checkout.
      - name: Check python-api coverage (vendored stubs vs reference/python-api)
        run: npm run check:python-api

      # ticket-014 (strategy §6b): advisory vendored-JSON-schema validation.
      # Asserts the COMMITTED public/schemas/ copy is present, exactly 18
      # files, and every file is well-formed JSON. This needs NO `novomodelo`
      # checkout — it is a static-metadata check like check:figures/check:d2.
      # The tag-drift check (`npm run refresh:schemas -- --check`, which DOES
      # need a `novomodelo` checkout) stays a local/maintainer action; the
      # authoritative freshness gate stays in `novomodelo` (ticket-016).
      - name: Check vendored JSON schemas (count + parse)
        run: |
          node -e '
            const { readdirSync, readFileSync } = require("node:fs");
            const files = readdirSync("public/schemas").filter((f) => f.endsWith(".schema.json"));
            if (files.length !== 18) {
              console.error("check:schemas: expected 18 vendored schema files, found " + files.length);
              process.exit(1);
            }
            for (const f of files) {
              JSON.parse(readFileSync("public/schemas/" + f, "utf8"));
            }
            console.log("check:schemas: " + files.length + " vendored schemas present and well-formed");
          '

      # ticket-243 (GRD-05): every gc-check fence on reference/generic-constraints behaves as marked under the pinned novomodelo (D-160-4, D-179-2).
      # The script sets no spawnSync timeout, so a hung `novomodelo validate` is bounded here.
      - name: Check generic-constraint examples (novomodelo validate)
        run: npm run check:gc-examples
        timeout-minutes: 5

      # ticket-243a (GRD-09, XD-129): the committed quickstart.gif matches scripts/recordings-provenance.json. Check only:
      # CI has no novomodelo checkout, so the tape blob prints "tape not checked" (D-198-4); never drop --check here.
      - name: Check recordings provenance (quickstart.gif sha256)
        run: npm run refresh:recordings -- --check

      # ticket-244c (XD-128): every reference Type cell uses the reference-conventions §4 vocabulary of its file kind; static source read, pre-build.
      - name: Check reference type spelling (§4 vocabulary)
        run: npm run check:type-spelling

      # E10 ticket-032 (licensing.md item 3): assert D2 uses ELK, never the
      # proprietary TALA engine (unlicensed TALA watermarks output). A static
      # source grep of astro.config.mjs + ```d2 blocks under src/ — pre-build,
      # like check:figures.
      - name: Check D2 layout (no TALA)
        run: npm run check:d2

      # E10 ticket-035 (licensing.md item 7): SPDX audit gate. Reads the declared
      # deps' installed `license` fields and fails if any is outside the permissive
      # allow-list and not the d2/ELK build-time-only exemption — the automated
      # guard protecting the "100% FOSS" claim / E8 cutover gate. Static metadata
      # check, pre-build like check:figures/check:d2; needs node_modules (npm ci ran).
      - name: Check SPDX licenses (FOSS guard)
        run: npm run check:spdx

      - name: Build (multi-version assembly)
        run: npm run build:versions

      # `npm test` MUST run AFTER the build: the scripts/*.test.mjs glob includes
      # a dist-gated test (i18n-locale) that reads dist/index.html and exits
      # non-zero ("run npm run build first") when dist/ is absent. On a
      # clean runner there is no dist/ until build:versions runs. (check:figures
      # stays pre-build — it reads src/, not dist/.) Keep the single glob'd
      # invocation so new tests are picked up automatically.
      - name: Test (compute layer + scripts)
        run: npm test

      - name: Check (astro check)
        run: npm run check

      - name: Check math parity
        run: npm run check:math

      - name: Check links
        run: npm run check:links

      # E10 ticket-029 completion gate, also run by starlight-deploy.yml (E15, XD-188).
      # It reads dist/ and asserts that the third-party notices and the content
      # license ship in the built site, so it runs after the build.
      - name: Check E10 completion gate
        run: npm run check:e10
