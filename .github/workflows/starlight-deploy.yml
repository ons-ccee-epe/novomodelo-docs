# ──────────────────────────────────────────────────────────────────────────────
# Production deploy for the Astro/Starlight docs.
#
# On every push to `main` (and on manual dispatch) this workflow builds the
# multi-version site, runs the checks below, writes dist/CNAME for
# docs.novomodelo.invalid and publishes dist/ to GitHub Pages.
#
# Checks, in step order:
#   `npm run gen:notices` with `git diff --exit-code` on the notices file,
#   `npm run check:figures`, `npm run check:d2`, `npm run check:spdx`,
#   `npm run build:versions`, `npm test`, `npm run check`, `npm run check:math`,
#   `npm run check:links`, `npm run check:e10`.
# A failing step stops the `build` job, and the `deploy` job (`needs: build`)
# never runs.
#
# The doc-lint gates (`check:voice`, `check:counts`, `check:version`,
# `check:narration`, the vendored-schema check and every gate added after them)
# run only in starlight-ci.yml, on pull requests to `main` and on manual dispatch;
# this workflow does not repeat them.
#
# The build recipe (Node, pinned d2, `build:versions`) matches starlight-ci.yml,
# and every action is pinned by commit SHA.
# ──────────────────────────────────────────────────────────────────────────────

name: Starlight deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages write + OIDC token for actions/deploy-pages; contents stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# The `pages` group keeps two runs of this workflow from publishing at once; an
# in-flight deploy is never cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Steps run at the repository root, where the Astro project lives; setup-node's
    # cache-dependency-path is the root `package-lock.json`.
    defaults:
      run:
        working-directory: .

    steps:
      # fetch-depth: 0 — Lunaria (the /lunaria dashboard) reads each content file's
      # git history; a shallow clone makes the Starlight build fail with "could not
      # retrieve last commit data". Full history is required.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: package-lock.json

      # astro-d2 shells out to a `d2` executable that must be on PATH at build
      # time, or D2 fenced blocks silently render nothing. Install a PINNED
      # release asset (reproducible) — NOT `curl … d2lang.com/install.sh | sh`
      # (the banned, unpinned curl|bash pattern).
      # sha256 pinned: d2 v0.7.1 ships no checksums file, so this hash was
      # computed from the released linux-amd64 asset. A tampered or replaced
      # tarball fails `sha256sum -c` and aborts the step before extraction.
      - name: Install d2 (pinned 0.7.1, sha256-verified)
        run: |
          d2_tarball=d2-v0.7.1-linux-amd64.tar.gz
          d2_sha256=eb172adf59f38d1e5a70ab177591356754ffaf9bebb84e0ca8b767dfb421dad7
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/v0.7.1/${d2_tarball}" -o "${d2_tarball}"
          echo "${d2_sha256}  ${d2_tarball}" | sha256sum -c -
          tar xzf "${d2_tarball}"
          sudo mv d2-v0.7.1/bin/d2 /usr/local/bin/d2
          sudo chmod +x /usr/local/bin/d2

      # Print the pinned version so a silent install failure surfaces here,
      # before the build, instead of as confusing "missing figures" output.
      - name: Verify d2
        run: d2 --version

      - name: Install dependencies
        run: npm ci

      # ── Checks, fail-closed before the Pages upload ──

      # E10 ticket-031: regenerate the third-party notices file and fail if
      # the committed copy is stale (drift guard). Uses permissions: contents: read
      # — no push, no auto-commit. Maintainer must run `npm run gen:notices` and
      # commit the result when deps change.
      - name: Notices drift guard
        run: |
          npm run gen:notices
          git diff --exit-code -- public/THIRD-PARTY-NOTICES.txt

      - name: Check figures (dependency guard)
        run: npm run check:figures

      # E10 ticket-032 (licensing.md item 3): assert D2 uses ELK, never the
      # proprietary TALA engine (unlicensed TALA watermarks output). A static
      # source grep of astro.config.mjs + ```d2 blocks under src/ — pre-build,
      # like check:figures.
      - name: Check D2 layout (no TALA)
        run: npm run check:d2

      # E10 ticket-035 (licensing.md item 7): SPDX audit gate. Reads the declared
      # deps' installed `license` fields and fails if any is outside the permissive
      # allow-list and not the d2/ELK build-time-only exemption — the automated
      # guard protecting the "100% FOSS" claim / E8 cutover gate. Static metadata
      # check, pre-build like check:figures/check:d2; needs node_modules (npm ci ran).
      - name: Check SPDX licenses (FOSS guard)
        run: npm run check:spdx

      - name: Build (multi-version assembly)
        run: npm run build:versions

      # `npm test` MUST run AFTER the build: the scripts/*.test.mjs glob includes
      # a dist-gated test (i18n-locale) that reads dist/index.html and exits
      # non-zero ("run npm run build first") when dist/ is absent. On a
      # clean runner there is no dist/ until build:versions runs. (check:figures
      # stays pre-build — it reads src/, not dist/.) Keep the single glob'd
      # invocation so new tests are picked up automatically.
      - name: Test (compute layer + scripts)
        run: npm test

      - name: Check (astro check)
        run: npm run check

      - name: Check math parity
        run: npm run check:math

      - name: Check links
        run: npm run check:links

      # E10 ticket-029 completion gate: the aggregate assertion that the E10
      # FOSS-notices/licensing workstream is complete. It reads dist/ and asserts
      # that the third-party notices and the content license ship in the built site.
      - name: Check E10 completion gate
        run: npm run check:e10

      # ── Publish ──
      # dist/ is the directory upload-pages-artifact uploads. Without dist/CNAME a
      # Pages deploy loses the docs.novomodelo.invalid custom domain and serves the
      # *.github.io URL.
      - name: Add CNAME for custom domain
        run: echo "docs.novomodelo.invalid" > dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
