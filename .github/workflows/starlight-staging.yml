# Starlight staging — a reviewable preview build of the Astro/Starlight docs.
#
# On every pull request to `main` (and on manual dispatch) this workflow installs
# Node and a pinned d2, runs `npm run build:versions`, and uploads dist/ as the
# `starlight-staging-site` artifact, kept for 7 days. It runs no test or check
# gate; those run in starlight-ci.yml.
#
# It does not publish to GitHub Pages: starlight-deploy.yml owns that, on push to
# `main`. This workflow cannot touch the Pages site:
#   * permissions are read-only (contents: read) — no pages: write, no id-token: write
#   * it uses actions/upload-artifact, not actions/deploy-pages or
#     actions/upload-pages-artifact
#   * it writes no CNAME
#   * it does not trigger on push: [main]
#
# ──────────────────────────────────────────────────────────────────────────────
# Manual "trigger staging + download artifact + serve locally + verify" procedure:
#   1. Open or refresh a pull request to `main` (or use the Actions tab
#      `workflow_dispatch` button) to run `Starlight staging`.
#   2. When the run is green, open it in the Actions UI and download the
#      `starlight-staging-site` artifact (the complete static site).
#   3. Unzip and serve locally: from the unzipped dir,
#        npx http-server -p 8080 .      # or: python3 -m http.server 8080
#      then open http://localhost:8080/ in a browser.
#   4. Walk the visual-verification checklist (below).
#
# Visual-verification checklist:
#   [ ] Landing page (/) renders with the copper shell and the title.
#   [ ] The sidebar lists every section and chapter in its configured group.
#   [ ] A math-dense chapter (e.g. /math/lp-formulation/) renders KaTeX display
#       blocks correctly in BOTH light and dark themes.
#   [ ] A D2 figure renders as inline SVG (build-time) — confirm theme-adaptive
#       colours.
#   [ ] An Observable Plot island (e.g. the value-function plot) renders and
#       recolours on theme toggle.
#   [ ] Internal cross-chapter links resolve (no 404s) — spot-check a few.
#   [ ] The language picker (root / pt-BR) and the version picker render in the
#       header.
#   [ ] Mobile/narrow-viewport layout is intact.
#
#   Note: D2 + KaTeX are build-time/static (visible in the artifact directly);
#   Observable Plot is client-rendered and needs the page actually open in a
#   browser (hence the local server).
# ──────────────────────────────────────────────────────────────────────────────

name: Starlight staging

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only: this build neither needs nor is granted Pages write. The absence of
# pages: write / id-token: write is the structural guarantee that staging cannot
# publish to the repo's one (production) Pages site.
permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. a force-push to an open PR).
concurrency:
  group: starlight-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Steps run at the repository root, where the Astro project lives; setup-node's
    # cache-dependency-path is the root `package-lock.json`.
    defaults:
      run:
        working-directory: .

    steps:
      # fetch-depth: 0 — Lunaria (the /lunaria dashboard) reads each content file's
      # git history; a shallow clone makes the Starlight build fail with "could not
      # retrieve last commit data". Full history is required.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: package-lock.json

      # astro-d2 shells out to a `d2` executable that must be on PATH at build
      # time, or D2 fenced blocks silently render nothing. Install a PINNED
      # release asset (reproducible) — NOT `curl … d2lang.com/install.sh | sh`
      # (the banned, unpinned curl|bash pattern).
      # sha256 pinned: d2 v0.7.1 ships no checksums file, so this hash was
      # computed from the released linux-amd64 asset. A tampered or replaced
      # tarball fails `sha256sum -c` and aborts the step before extraction.
      - name: Install d2 (pinned 0.7.1, sha256-verified)
        run: |
          d2_tarball=d2-v0.7.1-linux-amd64.tar.gz
          d2_sha256=eb172adf59f38d1e5a70ab177591356754ffaf9bebb84e0ca8b767dfb421dad7
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/v0.7.1/${d2_tarball}" -o "${d2_tarball}"
          echo "${d2_sha256}  ${d2_tarball}" | sha256sum -c -
          tar xzf "${d2_tarball}"
          sudo mv d2-v0.7.1/bin/d2 /usr/local/bin/d2
          sudo chmod +x /usr/local/bin/d2

      # Print the pinned version so a silent install failure surfaces here,
      # before the build, instead of as confusing "missing figures" output.
      - name: Verify d2
        run: d2 --version

      - name: Install dependencies
        run: npm ci

      - name: Build (multi-version assembly)
        run: npm run build:versions

      # Upload the fully-static built site as a downloadable artifact. This is the
      # staging "deploy": no Pages, no CNAME, no production resource touched. The
      # maintainer downloads it, serves it locally, and walks the checklist above.
      # if-no-files-found: error so a missing dist/ (build silently produced
      # nothing) fails loudly rather than shipping an empty artifact.
      - name: Upload staging site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starlight-staging-site
          path: dist
          retention-days: 7
          if-no-files-found: error
